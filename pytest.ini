[pytest]
# Pytest configuration for lightning monitor tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=lightning_monitor
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    -ra

# Markers
markers =
    unit: Unit tests that don't require external services
    integration: Integration tests that may require external services
    slow: Tests that take longer to run
    api: Tests that make actual API calls (use with caution)
    database: Tests that require database access

# Coverage options
[coverage:run]
source = lightning_monitor
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

