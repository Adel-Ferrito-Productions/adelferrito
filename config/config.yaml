# Malta Lightning Monitoring System Configuration

# Geographic boundaries for Malta monitoring area
location:
  name: "Malta"
  # Malta coordinates: 35.9375° N, 14.3754° E
  center:
    latitude: 35.9375
    longitude: 14.3754
  # Monitoring radius in kilometers
  monitoring_radius_km: 100
  # Bounding box for data fetching (extends beyond monitoring radius)
  bbox:
    min_lat: 35.0
    max_lat: 37.0
    min_lon: 13.0
    max_lon: 15.5

# Data source configurations
data_sources:
  blitzortung:
    enabled: true
    # Blitzortung API endpoint (community server)
    base_url: "https://data.blitzortung.org"
    # Fetch interval in seconds
    fetch_interval: 60
    # Historical data window in minutes
    historical_window: 60

  windy:
    enabled: true
    # Windy API requires key (set in .env)
    base_url: "https://api.windy.com/api"
    fetch_interval: 300  # 5 minutes
    # Requested weather parameters
    parameters:
      - "cape"
      - "lifted_index"
      - "pressure"
      - "clouds"
      - "temp"
      - "wind"
      - "thunder"

  eumetsat:
    enabled: false
    # EUMETSAT data access (requires credentials)
    base_url: "https://api.eumetsat.int"
    fetch_interval: 600  # 10 minutes
    products:
      - "MSG-IR"
      - "MSG-WV"

# Processing configurations
processing:
  lightning:
    min_strikes_for_storm: 15
    cluster_radius_km: 30
    density_grid_size_km: 5

  atmospheric:
    cape_threshold: 1000
    lifted_index_threshold: -3

# Alert configurations
alerts:
  levels:
    info:
      conditions:
        - "strikes_10min > 5"
      priority: 1

    watch:
      conditions:
        - "strikes_10min > 15"
        - "cape > 1000"
      priority: 2

    warning:
      conditions:
        - "strikes_10min > 30"
        - "cape > 1500"
      priority: 3

    urgent:
      conditions:
        - "strikes_10min > 50"
        - "cape > 2000"
        - "strike_distance < 10"
      priority: 4

  notifications:
    rate_limit:
      max_per_hour: 10
      suppress_duplicates_minutes: 15

# Storage configuration
storage:
  database:
    path: "lightning_monitor/data/cache/weather_data.db"
    retention_days: 30

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "lightning_monitor/data/logs/monitor.log"

# Scheduler configuration
scheduler:
  monitoring_interval: 60  # seconds
  daily_summary_time: "08:00"  # UTC
  cleanup_time: "02:00"  # UTC

